name: Apply Modern Theme issue 43 fix

on:
  push:
    branches:
      - fix/issue-43-partner-label

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-43-partner-label
          fetch-depth: 0

      - name: Apply partner and marriage wording fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('resources/views/individual-page.phtml')
          text = path.read_text(encoding='utf-8')

          old_row = "        $marriage_rows->push([\n            'spouse' => $spouse,\n            'date'   => $marriage?->date(),\n            'place'  => $marriage?->place()->gedcomName() ?? '',\n        ]);"
          new_row = "        $marriage_rows->push([\n            'spouse'  => $spouse,\n            'married' => $marriage instanceof Fact,\n            'date'    => $marriage?->date(),\n            'place'   => $marriage?->place()->gedcomName() ?? '',\n        ]);"
          if text.count(old_row) != 1:
              raise SystemExit('Expected spouse relationship row block once')
          text = text.replace(old_row, new_row, 1)

          start_marker = "if ($marriage_rows->isNotEmpty()) {"
          end_marker = "\n\nif ($children_count > 0) {"
          start = text.find(start_marker)
          if start == -1:
              raise SystemExit('Could not find life-summary relationship block')
          end = text.find(end_marker, start)
          if end == -1:
              raise SystemExit('Could not find end of life-summary relationship block')

          new_summary = "\n".join([
              "if ($marriage_rows->isNotEmpty()) {",
              "    $summary_relationship = $marriage_rows->first(static fn ($row): bool => is_array($row) && (bool) ($row['married'] ?? false));",
              "    if (!is_array($summary_relationship)) {",
              "        $summary_relationship = $marriage_rows->first();",
              "    }",
              "",
              "    if (is_array($summary_relationship) && $summary_relationship['spouse'] instanceof Individual) {",
              "        $spouse_name = $plain_text($summary_relationship['spouse']->fullName());",
              "        $is_married = (bool) ($summary_relationship['married'] ?? false);",
              "        $marriage_date_text = $summary_relationship['date']?->isOK() ? $plain_text($summary_relationship['date']->display()) : '';",
              "        $marriage_place_text = trim((string) $summary_relationship['place']);",
              "",
              "        if ($is_married) {",
              "            if ($marriage_date_text !== '' && $marriage_place_text !== '') {",
              "                $life_summary[] = I18N::translate('Married %s on %s in %s.', $spouse_name, $marriage_date_text, $marriage_place_text);",
              "            } elseif ($marriage_date_text !== '') {",
              "                $life_summary[] = I18N::translate('Married %s on %s.', $spouse_name, $marriage_date_text);",
              "            } elseif ($marriage_place_text !== '') {",
              "                $life_summary[] = I18N::translate('Married %s in %s.', $spouse_name, $marriage_place_text);",
              "            } else {",
              "                $life_summary[] = I18N::translate('Married %s.', $spouse_name);",
              "            }",
              "        } else {",
              "            $life_summary[] = I18N::translate('Partner: %s.', $spouse_name);",
              "        }",
              "    }",
              "}",
          ])
          text = text[:start] + new_summary + text[end:]

          old_label = "<span class=\"potts-vital-label\"><?= I18N::translate('Married') ?></span>"
          new_label = "<span class=\"potts-vital-label\"><?= I18N::translate((bool) ($row['married'] ?? false) ? 'Married' : 'Partner') ?></span>"
          if text.count(old_label) != 1:
              raise SystemExit('Expected marriage row label once')
          text = text.replace(old_label, new_label, 1)

          path.write_text(text, encoding='utf-8', newline='\n')

      - name: Validate and commit
        run: |
          php -l resources/views/individual-page.phtml
          git diff --check
          git config user.name "PottsNet"
          git config user.email "42736500+PottsNet@users.noreply.github.com"
          git add resources/views/individual-page.phtml
          git commit -m "Distinguish partners from marriages on individual page"
          git push origin HEAD:fix/issue-43-partner-label
